name: Deployment | Development

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: popli-465817
  REGION: europe-west1
  IMAGE_BACKEND_SHA_TAG: europe-west1-docker.pkg.dev/popli-465817/development/backend:${{ github.sha }}
  IMAGE_BACKEND_LATEST_TAG: europe-west1-docker.pkg.dev/popli-465817/development/backend:latest
  IMAGE_FRONTEND_SHA_TAG: europe-west1-docker.pkg.dev/popli-465817/development/frontend:${{ github.sha }}
  IMAGE_FRONTEND_LATEST_TAG: europe-west1-docker.pkg.dev/popli-465817/development/frontend:latest

jobs:
  deploy:
    name: Build and Deploy to GCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Login to Google Cloud Artifacts Registry
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: beta

      - name: Build & Tag Docker images
        run: |
          docker build \
            -t ${{ env.IMAGE_BACKEND_SHA_TAG }} \
            -f ./api/docker/Dockerfile.gcp \
            ./api
          docker build \
            -t ${{ env.IMAGE_FRONTEND_SHA_TAG }} \
            -f ./website/docker/Dockerfile \
            ./website

      - name: Configure Docker client for GCloud
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_BACKEND_SHA_TAG }}
          docker push ${{ env.IMAGE_FRONTEND_SHA_TAG }}

      - name: Set Docker image tag in Cloud Run config
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" api/cloud-run/development.yml
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" website/cloud-run/development.yml

      - name: Deploy to Cloud Run
        run: |
          gcloud beta run services replace api/cloud-run/development.yml --region=${{ env.REGION }} --platform=managed
          gcloud beta run services replace website/cloud-run/development.yml --region=${{ env.REGION }} --platform=managed
