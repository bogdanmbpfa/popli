name: popli

networks:
  popli:
    driver: bridge

volumes:
  popli-postgres-data:

services:
  database:
    container_name: database
    image: postgres:18.3
    ports:
      - 5432:5432
    environment:
      POSTGRES_URL: postgres://popli:popli@database:5432/popli
    volumes:
      - popli-postgres-data:/var/lib/postgresql
    networks:
      - popli