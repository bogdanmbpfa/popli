name: popli

networks:
  popli-network:
    driver: bridge

volumes:
  popli-postgres-data:
  redis-cache:

services:
  popli-database:
    container_name: popli-database
    image: postgres:16.1
    ports:
      - 5432:5432
    environment:
      POSTGRES_HOST: popli-database
      POSTGRES_USER: popli
      POSTGRES_PASSWORD: popli
      POSTGRES_DB: popli
      POSTGRES_PORT: 5432
    volumes:
      - popli-postgres-data:/var/lib/postgresql/data
    networks:
      - popli-network

  redis-cache:
    container_name: redis-cache
    image: redis:7.4.1-alpine
    restart: always
    ports:
      - 6379:6379
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis-cache:/data
    networks:
      - popli-network

  popli-api:
    container_name: popli-api
    build:
      context: ./api
      dockerfile: docker/Dockerfile
    env_file:
      - ./api/.env
    volumes:
      - ./api/:/app
      - ./api/node_modules:/app/node_modules
    ports:
      - 8000:8000
    networks:
      - popli-network
    depends_on:
      - popli-database