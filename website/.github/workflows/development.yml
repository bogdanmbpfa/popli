name: Deployment | Development

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: popli-465817
  REGION: europe-west3
  IMAGE_SHA_TAG: europe-west3-docker.pkg.dev/popli-465817/development/frontend:${{ github.sha }}
  IMAGE_LATEST_TAG: europe-west3-docker.pkg.dev/popli-465817/development/frontend:latest

jobs:
  deploy:
    name: Build and Deploy to GCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Login to Google Cloud Artifacts Registry
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: beta

      - name: Build & Tag Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_SHA_TAG }} \
            -f ./docker/Dockerfile \
            .

      - name: Configure Docker client for GCloud
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Push Docker image
        run: docker push ${{ env.IMAGE_SHA_TAG }}

      # - name: Set Docker image tag in Cloud Run config
      #   run: sed -i "s|IMAGE_TAG|${{ github.sha }}|g" cloud-run/development.yml

      # - name: Deploy to Cloud Run
      #   run: gcloud beta run services replace cloud-run/development.yml --region=${{ env.REGION }} --platform=managed
